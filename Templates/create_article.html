<!DOCTYPE html>

<html>
<head>
    <title>Create Article</title>
</head>

<body>

<h1>Create Article</h1>


<!-- Title -->

<input
    id="title"
    placeholder="Title"
    style="
        width:100%;
        padding:10px;
        margin-bottom:10px;
    "
>


<!-- Slug -->

<div style="
    display:flex;
    margin-bottom:10px;
">

    <span style="
        padding:10px;
        background:#eee;
        border:1px solid #ccc;
        border-right:none;
    ">
        https://thenewsfeeds.in/
    </span>

    <input
        id="slug"
        placeholder="article-slug"
        style="
            flex:1;
            padding:10px;
        "
    >

</div>


<!-- Category -->

<select
    id="category"
    style="
        width:100%;
        padding:10px;
        margin-bottom:10px;
    "
>

    <option value="">
        Select Category
    </option>

    <option value="World">
        World
    </option>

    <option value="India">
        India
    </option>

    <option value="Kerala">
        Kerala
    </option>

    <option value="Entertainment">
        Entertainment
    </option>

    <option value="Gulf">
        Gulf
    </option>

    <option value="Tech">
        Tech
    </option>

    <option value="Sports">
        Sports
    </option>

    <option value="Crime">
        Crime
    </option>

</select>


<!-- Image URL -->

<input
    id="image_url"
    placeholder="Image URL"
    style="
        width:100%;
        padding:10px;
        margin-bottom:10px;
    "
>


<!-- Content -->

<textarea
    id="content"
    rows="15"
    placeholder="Content"
    style="
        width:100%;
        padding:10px;
    "
></textarea>


<br><br>


<!-- Create Button -->

<button onclick="createArticle()">
    Create Article
</button>


<script>

async function createArticle(){

    const title =
        document.getElementById(
            "title"
        ).value.trim();


    const slug =
        document.getElementById(
            "slug"
        ).value.trim();


    const category =
        document.getElementById(
            "category"
        ).value;


    const image_url =
        document.getElementById(
            "image_url"
        ).value.trim();


    const content =
        document.getElementById(
            "content"
        ).value;


    // ---------------------------------------------
    // Basic validation
    // ---------------------------------------------

    if(!title){

        alert(
            "Please enter a title."
        );

        return;
    }


    if(!slug){

        alert(
            "Please enter a slug."
        );

        return;
    }


    if(!category){

        alert(
            "Please select a category."
        );

        return;
    }


    if(!content.trim()){

        alert(
            "Please enter content."
        );

        return;
    }


    // ---------------------------------------------
    // Send request
    // ---------------------------------------------

    try{

        const response = await fetch(
            "/admin/create-article",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({

                    title:title,

                    slug:slug,

                    category:category,

                    image_url:image_url,

                    content:content

                })
            }
        );


        // -----------------------------------------
        // Success
        // -----------------------------------------

        if(response.ok){

            alert(
                "Article Created"
            );

            window.location.href =
                "/admin/pending";

            return;
        }


        // -----------------------------------------
        // Error response
        // -----------------------------------------

        let errorMessage =
            "Failed to create article.";

        try{

            const error =
                await response.json();

            if(error.detail){

                errorMessage =
                    error.detail;
            }

        }
        catch(e){

            // Ignore JSON parsing error

        }


        alert(
            errorMessage
        );

    }
    catch(error){

        alert(
            "Could not connect to the server."
        );

        console.error(
            error
        );

    }

}

</script>

</body>
</html>
