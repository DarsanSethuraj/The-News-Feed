<!DOCTYPE html>
<html>
<head>
    <title>Pending Articles</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="/static/css/pending.css"
    >
</head>
<body>
    <div class="dashboard-header">
        <h1>News Moderation Panel</h1>
        <p>{{ article_count }} Articles Awaiting Review</p>
    </div>

    {% for article in articles %}
        <div id="article-{{ article.id }}" class="article-card
        ">
            <h2>{{ article.title }}</h2>

            {% if article.image_url %}
                <img src="{{ article.image_url }}" class="article-image">
            {% endif %}
            
            
            <div class="meta-row">

                <p style="
                    color:#5f0000;
                    font-weight:500;
                    margin:0;
                ">
                    <strong style="color:#111;">
                        Author:
                    </strong>

                    {{ article.author }}
                </p>

                <p style="margin:0;">
                    <strong>Category:</strong>
                    {{ article.category }}
                </p>

                <button
                    onclick="toggleEdit({{ article.id }})"
                    class="edit-btn"
                >
                    ✎
                </button>

            </div>

            

            <div
                id="content-display-{{ article.id }}"
                style="
                    line-height:1.8;
                    font-size:17px;
                    margin-top:15px;
                "
            >
                {{ article.content | safe }}
            </div>

            <form
                id="edit-form-{{ article.id }}"
                method="POST"
                action="/admin/update/{{ article.id }}"
                style="
                    display:none;
                    margin-top:20px;
                    margin-bottom:35px;
                "
            >

                <textarea
                    name="content"
                    rows="15"
                    style="
                        width:100%;
                        margin-top:15px;
                        font-size:16px;
                        padding:10px;
                        box-sizing:border-box;
                    "
                >{{ article.content }}</textarea>

                <div style="
                    margin-top:15px;
                    display:flex;
                    gap:12px;
                ">

                    <button
                        type="submit"
                        style="
                            background:#1f7a1f;
                            color:white;
                            border:none;
                            padding:10px 18px;
                            border-radius:6px;
                            cursor:pointer;
                            font-weight:bold;
                        "
                    >
                        Save Changes
                    </button>

                    <button
                        type="button"
                        onclick="toggleEdit({{ article.id }})"
                        style="
                            background:#666;
                            color:white;
                            border:none;
                            padding:10px 18px;
                            border-radius:6px;
                            cursor:pointer;
                            font-weight:bold;
                        "
                    >
                        Cancel
                    </button>

                </div>

            </form>

            <div class="tier-row">

                <label>
                    <input
                        type="checkbox"
                        id="tier25-{{ article.id }}"
                    >
                    25
                </label>

                <label style="margin-left:15px;">
                    <input
                        type="checkbox"
                        id="tier50-{{ article.id }}"
                    >
                    50
                </label>

                <label style="margin-left:15px;">
                    <input
                        type="checkbox"
                        id="tier100-{{ article.id }}"
                    >
                    100
                </label>

            </div>

            <div class="action-row"
            >

                <button
                    onclick="approveArticle({{ article.id }})"
                    class="action-btn approve-btn"
                >
                    Approve
                </button>

                <button 
                    onclick="confirmBreaking({{ article.id }})"
                    class="action-btn breaking-btn"
                >
                    BREAKING
                </button>

                <button 
                    onclick="moderateArticle({{ article.id }}, 'reject')"
                    class="action-btn reject-btn"
                >
                    Reject
                </button>

            </div>
        </div>
    {% endfor %}

    <script>
        async function moderateArticle(articleId, action) {
            try {
                const res = await fetch("/" + action + "/" + articleId, {
                    method: "POST"
                });

                const articleEl = document.getElementById("article-" + articleId);

                if (!res.ok) {
                    articleEl.style.backgroundColor = "#fff3cd";
                    articleEl.style.borderColor = "#ff9800";
                    return;
                }

                if (action === "approve") {
                    articleEl.style.backgroundColor = "#d4edda";
                    articleEl.style.borderColor = "green";
                } else {
                    articleEl.style.backgroundColor = "#f8d7da";
                    articleEl.style.borderColor = "red";
                }

                setTimeout(function () {
                    articleEl.remove();
                }, 800);

            } catch (err) {
                const articleEl = document.getElementById("article-" + articleId);
                articleEl.style.backgroundColor = "#fff3cd";
                articleEl.style.borderColor = "#ff9800";
            }
        }

        function toggleEdit(articleId) {

            const form = document.getElementById(
                "edit-form-" + articleId
            );

            if (form.style.display === "none") {

                form.style.display = "block";

            }

            else {

                form.style.display = "none";

            }
        }

        async function confirmBreaking(articleId) {

            const confirmed = confirm(
                "Force publish this article as BREAKING news?"
            );

            if (!confirmed) {
                return;
            }

            try {

                const res = await fetch(
                    "/breaking/" + articleId,
                    {
                        method: "POST"
                    }
                );

                const articleEl = document.getElementById(
                    "article-" + articleId
                );

                if (!res.ok) {

                    articleEl.style.backgroundColor = "#fff3cd";
                    articleEl.style.borderColor = "#ff9800";

                    return;
                }

                articleEl.style.backgroundColor = "#cccfff";
                articleEl.style.borderColor = "blue";

                setTimeout(function () {

                    articleEl.remove();

                }, 800);

            } catch (err) {

                const articleEl = document.getElementById(
                    "article-" + articleId
                );

                articleEl.style.backgroundColor = "#fff3cd";
                articleEl.style.borderColor = "#ff9800";
            }
        }
    </script>

    <script>

        async function approveArticle(articleId) {

            const tiers = [];

            if (
                document.getElementById(
                    `tier25-${articleId}`
                ).checked
            ) {
                tiers.push(25);
            }

            if (
                document.getElementById(
                    `tier50-${articleId}`
                ).checked
            ) {
                tiers.push(50);
            }

            if (
                document.getElementById(
                    `tier100-${articleId}`
                ).checked
            ) {
                tiers.push(100);
            }

            const res = await fetch(
                `/approve/${articleId}`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        tiers: tiers
                    })
                }
            );

            if(res.ok){

                document
                    .getElementById(
                        `article-${articleId}`
                    )
                    .remove();
            }
        }

        </script>
</body>
</html>
