<!DOCTYPE html>
<html>
<head>
    <title>Pending Articles</title>
</head>
<body>
    <h1>Pending Articles</h1>

    <h2>Matching Articles: {{ article_count }}</h2>

    {% for article in articles %}
        <div id="article-{{ article.id }}" style="
            border:1px solid #ccc;
            padding:15px;
            margin-bottom:20px;
            transition: all 0.3s ease;
        ">
            <h2>{{ article.title }}</h2>

            {% if article.image_url %}
                <img src="{{ article.image_url }}" width="300">
            {% endif %}
            
            
            <div style="
                display:flex;
                align-items:center;
                gap:15px;
                margin-top:10px;
                margin-bottom:15px;
            ">

                <p style="
                    color:#5f0000;
                    font-weight:500;
                    margin:0;
                ">
                    <strong style="color:#111;">
                        Author:
                    </strong>

                    {{ article.author }}
                </p>

                <p style="margin:0;">
                    <strong>Category:</strong>
                    {{ article.category }}
                </p>

                <button
                    onclick="toggleEdit({{ article.id }})"
                    style="
                        width:36px;
                        height:36px;
                        border:none;
                        border-radius:8px;
                        background:#222;
                        color:white;
                        font-size:18px;
                        cursor:pointer;
                    "
                >
                    ✎
                </button>

            </div>

            

            <div
                id="content-display-{{ article.id }}"
                style="
                    line-height:1.8;
                    font-size:17px;
                    margin-top:15px;
                "
            >
                {{ article.content | safe }}
            </div>

            <form
                id="edit-form-{{ article.id }}"
                method="POST"
                action="/admin/update/{{ article.id }}"
                style="
                    display:none;
                    margin-top:20px;
                    margin-bottom:35px;
                "
            >
                <div style="
                    display:flex;
                    justify-content:flex-end;
                    margin-bottom:10px;
                ">
                    <button
                        type="button"
                        onclick="copyContent({{ article.id }})"
                        style="
                            background:#007bff;
                            color:white;
                            border:none;
                            padding:12px 24px;
                            border-radius:8px;
                            cursor:pointer;
                            font-weight:bold;
                            font-size:18px;
                        "
                    >
                        📋 Copy Content
                    </button>
                </div>

                <textarea
                    id="content-editor-{{ article.id }}"
                    name="content"
                    rows="15"
                    style="
                        width:100%;
                        margin-top:15px;
                        font-size:16px;
                        padding:10px;
                        box-sizing:border-box;
                    "
                >{{ article.content }}</textarea>

                <div style="
                    margin-top:15px;
                    display:flex;
                    gap:12px;
                ">

                    <button
                        type="submit"
                        style="
                            background:#1f7a1f;
                            color:white;
                            border:none;
                            padding:10px 18px;
                            border-radius:6px;
                            cursor:pointer;
                            font-weight:bold;
                            font-size:22px;
                        "
                    >
                        Save Changes
                    </button>

                    <button
                        type="button"
                        onclick="toggleEdit({{ article.id }})"
                        style="
                            background:#666;
                            color:white;
                            border:none;
                            padding:10px 18px;
                            border-radius:6px;
                            cursor:pointer;
                            font-weight:bold;
                            font-size:22px;
                        "
                    >
                        Cancel
                    </button>

                </div>

            </form>

            <div style="
                margin:15px 0;
                display:flex;
                gap:25px;
                align-items:center;
            ">

                <label style="
                    font-size:22px;
                    font-weight:bold;
                    display:flex;
                    align-items:center;
                    gap:8px;
                ">
                    <input
                        type="checkbox"
                        id="tier25-{{ article.id }}"
                        style="
                            width:32px;
                            height:32px;
                        "
                    >
                    25
                </label>

                <label style="
                    font-size:22px;
                    font-weight:bold;
                    display:flex;
                    align-items:center;
                    gap:8px;
                ">
                    <input
                        type="checkbox"
                        id="tier50-{{ article.id }}"
                        style="
                            width:32px;
                            height:32px;
                        "
                    >
                    50
                </label>

                <label style="
                    font-size:22px;
                    font-weight:bold;
                    display:flex;
                    align-items:center;
                    gap:8px;
                ">
                    <input
                        type="checkbox"
                        id="tier100-{{ article.id }}"
                        style="
                            width:32px;
                            height:32px;
                        "
                    >
                    100
                </label>

            </div>

            <div style="
                margin-top:30px;
            ">

                <button
                    onclick="approveArticle({{ article.id }})"
                    style="
                        padding:15px 30px;
                        font-size:18px;
                        font-weight:bold;
                        min-width:140px;
                        border:none;
                        border-radius:8px;
                        cursor:pointer;
                        background:#28a745;
                        color:white;
                    "
                >
                    Approve
                </button>

                <button 
                    onclick="confirmBreaking({{ article.id }})"
                    style="
                        padding:15px 30px;
                        font-size:18px;
                        font-weight:bold;
                        min-width:140px;
                        border:none;
                        border-radius:8px;
                        cursor:pointer;
                        background:red;
                        color:white;
                    "
                >
                    BREAKING
                </button>

                <button 
                    onclick="moderateArticle({{ article.id }}, 'reject')"
                    style="
                        padding:15px 30px;
                        font-size:18px;
                        font-weight:bold;
                        min-width:140px;
                        border:none;
                        border-radius:8px;
                        cursor:pointer;
                        background:#555;
                        color:white;
                    "
                >
                    Reject
                </button>

            </div>
        </div>
    {% endfor %}

    <script>
        async function moderateArticle(articleId, action) {
            try {
                const res = await fetch("/" + action + "/" + articleId, {
                    method: "POST"
                });

                const articleEl = document.getElementById("article-" + articleId);

                if (!res.ok) {
                    articleEl.style.backgroundColor = "#fff3cd";
                    articleEl.style.borderColor = "#ff9800";
                    return;
                }

                if (action === "approve") {
                    articleEl.style.backgroundColor = "#d4edda";
                    articleEl.style.borderColor = "green";
                } else {
                    articleEl.style.backgroundColor = "#f8d7da";
                    articleEl.style.borderColor = "red";
                }

                setTimeout(function () {
                    articleEl.remove();
                }, 800);

            } catch (err) {
                const articleEl = document.getElementById("article-" + articleId);
                articleEl.style.backgroundColor = "#fff3cd";
                articleEl.style.borderColor = "#ff9800";
            }
        }

        function toggleEdit(articleId) {

            const form = document.getElementById(
                "edit-form-" + articleId
            );

            if (form.style.display === "none") {

                form.style.display = "block";

            }

            else {

                form.style.display = "none";

            }
        }

        function copyContent(articleId) {

            const textarea = document.getElementById(
                "content-editor-" + articleId
            );

            textarea.select();
            textarea.setSelectionRange(0, 999999);

            navigator.clipboard.writeText(
                textarea.value
            );

        }

        async function confirmBreaking(articleId) {

            const confirmed = confirm(
                "Force publish this article as BREAKING news?"
            );

            if (!confirmed) {
                return;
            }

            try {

                const res = await fetch(
                    "/breaking/" + articleId,
                    {
                        method: "POST"
                    }
                );

                const articleEl = document.getElementById(
                    "article-" + articleId
                );

                if (!res.ok) {

                    articleEl.style.backgroundColor = "#fff3cd";
                    articleEl.style.borderColor = "#ff9800";

                    return;
                }

                articleEl.style.backgroundColor = "#cccfff";
                articleEl.style.borderColor = "blue";

                setTimeout(function () {

                    articleEl.remove();

                }, 800);

            } catch (err) {

                const articleEl = document.getElementById(
                    "article-" + articleId
                );

                articleEl.style.backgroundColor = "#fff3cd";
                articleEl.style.borderColor = "#ff9800";
            }
        }
    </script>

    <script>

        async function approveArticle(articleId) {

            const tiers = [];

            if (
                document.getElementById(
                    `tier25-${articleId}`
                ).checked
            ) {
                tiers.push(25);
            }

            if (
                document.getElementById(
                    `tier50-${articleId}`
                ).checked
            ) {
                tiers.push(50);
            }

            if (
                document.getElementById(
                    `tier100-${articleId}`
                ).checked
            ) {
                tiers.push(100);
            }

            const res = await fetch(
                `/approve/${articleId}`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        tiers: tiers
                    })
                }
            );

            if(res.ok){

                document
                    .getElementById(
                        `article-${articleId}`
                    )
                    .remove();
            }
        }

        </script>
</body>
</html>
